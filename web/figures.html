<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRT Oracle: 3D personalities</title>
<style>
  :root {
    --bg: #170b02;
    --fg: #ffb347;
    --font: Consolas, "Lucida Console", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font);
    transition: background-color 0.9s, color 0.9s;
  }
  /* The figure: a plain text block, one character per rendered cell. */
  #art {
    position: fixed; left: 50%; top: 50%; margin: 0; transform: translate(-50%, -50%);
    line-height: 1; white-space: pre; user-select: none;
    text-shadow: 0 0 4px currentColor;
  }
  .hud {
    position: fixed; left: 2ch; top: 1.5em; font-size: 14px; line-height: 1.5;
    text-shadow: 0 0 4px currentColor; pointer-events: none;
  }
  .hud .name { font-size: 22px; letter-spacing: 0.3em; }
  .keys {
    position: fixed; left: 2ch; bottom: 1.5em; font-size: 13px; opacity: 0.75;
    display: flex; gap: 2ch; flex-wrap: wrap; right: 2ch;
  }
  .keys button {
    font: inherit; color: inherit; background: transparent; border: 1px solid currentColor;
    padding: 2px 8px; cursor: pointer; opacity: 0.85;
  }
  .keys button[aria-pressed="true"] { opacity: 1; background: color-mix(in srgb, currentColor 18%, transparent); }
  /* Scanlines and a vignette, like the glass of the CRT. */
  .crt {
    position: fixed; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.6) 100%);
  }
  .look {
    position: fixed; width: 18px; height: 18px; margin: -9px 0 0 -9px; pointer-events: none;
    border: 1px solid currentColor; opacity: 0; transition: opacity 0.3s;
  }
  .look.on { opacity: 0.5; }
</style>
</head>
<body>
<pre id="art" aria-label="ASCII figure"></pre>
<div class="hud">
  <div class="name" id="name">SUGAR</div>
  <div id="sub">the sun</div>
  <div id="stats"></div>
</div>
<div class="keys">
  <button data-p="sugar">1 sugar</button>
  <button data-p="weary">2 weary</button>
  <button data-p="clinical">3 clinical</button>
  <button id="talk">T talking</button>
  <button id="cycle">C cycle</button>
  <span>the mouse stands in for the participant's face</span>
</div>
<div class="look" id="look"></div>
<div class="crt" aria-hidden="true"></div>

<script src="vendor/three.min.js"></script>
<script src="js/ascii3d.js"></script>
<script src="js/figures.js"></script>
<script>
(function () {
  "use strict";
  const params = new URLSearchParams(location.search);
  const ROWS = +params.get("rows") || 56; // rows of text; columns follow the window
  const FPS = 30;
  const P = Oracle.PERSONALITIES_3D;

  const art = document.getElementById("art");
  const state = {
    personality: P[params.get("p")] ? params.get("p") : "sugar",
    talking: params.get("talk") === "1",
    cycle: params.get("cycle") === "1",
    look: null,
    cycleAt: 0,
  };
  const figures = new Oracle.Figures({ personality: state.personality });

  // Size the text block to the window: font from the rows, columns from the measured glyph width.
  let cols = 0, rows = 0;
  function resize() {
    const size = Math.max(6, Math.floor(window.innerHeight / ROWS));
    art.style.fontSize = size + "px";
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = size + "px " + getComputedStyle(art).fontFamily;
    const cw = ctx.measureText("M").width;
    rows = Math.floor(window.innerHeight / size);
    cols = Math.floor(window.innerWidth / cw);
    figures.cellAspect = cw / size;
  }
  resize();
  window.addEventListener("resize", resize);

  function escape(ch) {
    return ch === "<" ? "&lt;" : ch === ">" ? "&gt;" : ch === "&" ? "&amp;" : ch;
  }

  // One span per run of the same colour; a few hundred spans a frame.
  function toHTML(out) {
    let html = "";
    for (let y = 0; y < out.rows; y++) {
      let run = "", runColor = undefined;
      for (let x = 0; x < out.cols; x++) {
        const i = y * out.cols + x;
        const c = out.colors[i] || null;
        if (c !== runColor && out.chars[i] !== " ") {
          if (run) html += runColor ? `<span style="color:${runColor}">${run}</span>` : run;
          run = "";
          runColor = c;
        }
        run += escape(out.chars[i]);
      }
      html += runColor ? `<span style="color:${runColor}">${run}</span>` : run;
      html += "\n";
    }
    return html;
  }

  function setPersonality(id) {
    state.personality = id;
    const c = P[id].colors;
    document.body.style.setProperty("--bg", c.bg);
    document.body.style.setProperty("--fg", c.mid);
    document.getElementById("name").textContent = P[id].name;
    document.getElementById("sub").textContent = "the " + P[id].figure;
    for (const b of document.querySelectorAll("[data-p]")) b.setAttribute("aria-pressed", b.dataset.p === id);
  }
  setPersonality(state.personality);

  function setTalking(on) {
    state.talking = on;
    document.getElementById("talk").setAttribute("aria-pressed", on);
  }
  function setCycle(on) {
    state.cycle = on;
    state.cycleAt = performance.now();
    document.getElementById("cycle").setAttribute("aria-pressed", on);
  }
  setTalking(state.talking);
  setCycle(state.cycle);

  // The mouse is a stand-in for the webcam: where the participant's face is, -1..1.
  const lookEl = document.getElementById("look");
  window.addEventListener("mousemove", (e) => {
    state.look = {
      x: (e.clientX / window.innerWidth) * 2 - 1,
      y: -((e.clientY / window.innerHeight) * 2 - 1),
    };
    lookEl.style.left = e.clientX + "px";
    lookEl.style.top = e.clientY + "px";
    lookEl.classList.add("on");
  });
  document.addEventListener("mouseleave", () => {
    state.look = null;
    lookEl.classList.remove("on");
  });
  if (params.has("lx")) state.look = { x: +params.get("lx"), y: +params.get("ly") || 0 };

  const order = Object.keys(P);
  document.addEventListener("keydown", (e) => {
    const n = "123".indexOf(e.key);
    if (n >= 0) setPersonality(order[n]);
    else if (e.key === "t" || e.key === "T") setTalking(!state.talking);
    else if (e.key === "c" || e.key === "C") setCycle(!state.cycle);
  });
  for (const b of document.querySelectorAll("[data-p]")) b.addEventListener("click", () => setPersonality(b.dataset.p));
  document.getElementById("talk").addEventListener("click", () => setTalking(!state.talking));
  document.getElementById("cycle").addEventListener("click", () => setCycle(!state.cycle));

  const stats = document.getElementById("stats");
  const start = performance.now();
  let last = 0, ms = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (now - last < 1000 / FPS) return;
    last = now;
    if (state.cycle && now - state.cycleAt > 7000) {
      state.cycleAt = now;
      setPersonality(order[(order.indexOf(state.personality) + 1) % order.length]);
    }
    const t0 = performance.now();
    // ?still=SECONDS freezes the clock, for screenshots.
    const t = params.has("still") ? +params.get("still") : (now - start) / 1000;
    const out = figures.render(cols, rows, t, {
      personality: state.personality,
      mood: state.talking ? "talking" : "idle",
      look: state.look,
    });
    art.innerHTML = toHTML(out);
    ms = ms * 0.9 + (performance.now() - t0) * 0.1;
    stats.textContent = `${cols} x ${rows} cells · ${ms.toFixed(1)} ms/frame`;
  }
  requestAnimationFrame(loop);

  window.figuresDemo = { figures, state, setPersonality, setTalking };
})();
</script>
</body>
</html>
