<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Painted Face — Impasto Relief Reconstruction</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#101013; --panel-bg:rgba(20,20,25,0.78); --panel-border:rgba(255,255,255,0.13);
    --text:#eeeef0; --text-dim:#9a9aa4; --accent:#e0a24c;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#e9e7e3; --panel-bg:rgba(255,255,255,0.82); --panel-border:rgba(0,0,0,0.1);
      --text:#171717; --text-dim:#5a5a5a; --accent:#b3651a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#101013; --panel-bg:rgba(20,20,25,0.78); --panel-border:rgba(255,255,255,0.13);
    --text:#eeeef0; --text-dim:#9a9aa4; --accent:#e0a24c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);}
  #canvas-holder{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .panel{position:fixed;background:var(--panel-bg);border:1px solid var(--panel-border);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:14px;padding:13px 15px;
    max-width:min(300px,84vw);}
  #title-panel{top:14px;left:14px;}
  #title-panel h1{font-size:14px;margin:0 0 4px 0;font-weight:600;letter-spacing:.2px;}
  #title-panel p{font-size:11.5px;line-height:1.5;margin:0;color:var(--text-dim);}
  #ref-panel{top:14px;right:14px;padding:7px;display:flex;flex-direction:column;align-items:center;gap:5px;}
  #ref-panel img{width:80px;height:auto;border-radius:7px;display:block;}
  #ref-panel span{font-size:9.5px;color:var(--text-dim);letter-spacing:.4px;text-transform:uppercase;}
  #controls-panel{bottom:14px;left:14px;display:flex;gap:7px;padding:9px 11px;align-items:center;flex-wrap:wrap;
    max-width:min(430px,92vw);}
  button{font-family:inherit;font-size:11.5px;color:var(--text);background:transparent;
    border:1px solid var(--panel-border);border-radius:8px;padding:6px 11px;cursor:pointer;transition:background .15s;}
  button:hover{background:rgba(128,128,128,0.18);}
  button.active{background:var(--accent);color:#141414;border-color:var(--accent);}
  .row{display:flex;align-items:center;gap:8px;width:100%;}
  .row label{font-size:10.5px;color:var(--text-dim);white-space:nowrap;width:52px;}
  input[type=range]{flex:1;accent-color:var(--accent);height:15px;}
  #hint{position:fixed;bottom:14px;right:14px;font-size:10.5px;color:var(--text-dim);
    background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:10px;padding:7px 11px;
    max-width:165px;text-align:right;line-height:1.45;}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:12.5px;letter-spacing:.5px;z-index:10;background:var(--bg);}
  #bar{width:180px;height:2px;background:rgba(128,128,128,0.25);border-radius:2px;overflow:hidden;}
  #bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s;}
</style>
</head>
<body>
<div id="loading">building impasto surface…<div id="bar"><i></i></div></div>
<div id="canvas-holder"></div>

<div class="panel" id="title-panel">
  <h1>Painted Face — Impasto Relief</h1>
  <p>The painting rebuilt as a physical object: paint thickness read from the brushwork, torn edge traced from the silhouette, and an optional sculpted volume beneath. Watertight generated mesh.</p>
</div>

    geo.addGroup(0, idxFront.length, 0);                               // painted face
    geo.addGroup(idxFront.length, idxBack.length+idxWall.length, 1);   // board & edges

    // ---------- textures ----------
    var texLoader=new THREE.TextureLoader();
    var colorTex=texLoader.load(SRC.color);
    if(THREE.sRGBEncoding!==undefined) colorTex.encoding=THREE.sRGBEncoding;
    colorTex.anisotropy = renderer.capabilities.getMaxAnisotropy
      ? renderer.capabilities.getMaxAnisotropy() : 1;

    matFront=new THREE.MeshStandardMaterial({
      map:colorTex, roughness:0.82, metalness:0.0, envMapIntensity:0.55
    });
    matSide=new THREE.MeshStandardMaterial({
      color:0xbfae93, roughness:0.95, metalness:0.0, envMapIntensity:0.3
    });

    mesh=new THREE.Mesh(geo,[matFront,matSide]);
    mesh.castShadow=true; mesh.receiveShadow=true;
    scene.add(mesh);
    prog(0.9);

    applyDisplacement();
    prog(1);
    document.getElementById('loading').style.display='none';
    animate();
  }

  // ---------- displacement: impasto paint + sculpted volume ----------
  var reliefAmt=0.38, impastoAmt=1.0;
  function applyDisplacement(){
    if(!mesh) return;
    var pos = mesh.geometry.attributes.position;
    var vCount = SAMP_W*SAMP_H;
    for(var k=0;k<vCount;k++){
      var paint  = HMAP[k]*PAINT_MAX*impastoAmt;
      var volume = SMAP[k]*RELIEF_MAX*reliefAmt;
      pos.setZ(k, paint + volume);
      pos.setZ(vCount+k, -BOARD + volume*0.35);   // board follows the volume a little
    }
    pos.needsUpdate=true;
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
  }

  // ---------- UI ----------
  var auto=true, flat=false, wireOn=false;
  var bRot=document.getElementById('btn-rotate');
  bRot.onclick=function(){auto=!auto;bRot.classList.toggle('active',auto);};
  var bFlat=document.getElementById('btn-flat');
  bFlat.onclick=function(){
    flat=!flat; bFlat.classList.toggle('active',flat);
    bFlat.textContent = flat? 'Stand up' : 'Flat on';
  };
  var bRake=document.getElementById('btn-raking');
  bRake.onclick=function(){raking=!raking;bRake.classList.toggle('active',raking);placeLight();};
  var bWire=document.getElementById('btn-wire');
  bWire.onclick=function(){
    wireOn=!wireOn; bWire.classList.toggle('active',wireOn);
    if(matFront) matFront.wireframe=wireOn;
    if(matSide)  matSide.wireframe=wireOn;
  };
  document.getElementById('relief').addEventListener('input',function(e){
    reliefAmt=parseFloat(e.target.value)/100; applyDisplacement();
  });
  document.getElementById('impasto').addEventListener('input',function(e){
    impastoAmt=parseFloat(e.target.value)/100; applyDisplacement();
  });
  document.getElementById('lightang').addEventListener('input',function(e){
    lightAngle=parseFloat(e.target.value); placeLight();
  });

  window.addEventListener('resize',function(){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  });
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){
      scene.background=new THREE.Color(bgColor());
    });
  }

  var tiltCur=0;
  function animate(){
    requestAnimationFrame(animate);
    if(mesh){
      if(auto) mesh.rotation.y+=0.004;
      var target = flat? -Math.PI/2 : 0;          // lay it down like a painted tile
      tiltCur += (target-tiltCur)*0.08;
      mesh.rotation.x = tiltCur;
    }
    controls.update();
    renderer.render(scene,camera);
  }
})();
</script>
</body>
</html>
