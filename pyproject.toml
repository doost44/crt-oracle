[project]
name = "crt-oracle"
version = "0.1.0"
description = "A deceptive little oracle for a CRT, a camcorder and a receipt printer."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
# Pinned below 5: OpenCV 5 dropped the classic face detector this repo uses.
camera = ["opencv-python>=4.8,<5", "numpy"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["oracle*"]

[tool.setuptools.package-data]
"oracle.camera" = ["models/*.onnx", "models/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
